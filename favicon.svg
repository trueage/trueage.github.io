<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30AFFF" />
      <stop offset="100%" stop-color="#92EEFF" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8FFC5" />
      <stop offset="100%" stop-color="#C4F7CA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#020617" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Stylized Hourglass / Infinity Clock -->
  <circle cx="32" cy="32" r="22" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="110 30" filter="url(#glow)" />
  <path d="M24 20H40L33 31C32.5 31.7 32.5 32.3 33 33L40 44H24L31 33C31.5 32.3 31.5 31.7 31 31L24 20Z" stroke="url(#mintGrad)" stroke-width="2.5" stroke-linejoin="round" fill="none" />
  <circle cx="32" cy="32" r="3" fill="#92EEFF" />
  <circle cx="32" cy="39" r="1.5" fill="#D8FFC5" />
</svg>
